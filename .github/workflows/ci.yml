name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS (Xcode 26)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 26
        # The newest non-beta Xcode 26 the image carries; fails unless the active Xcode is then a 26.
        run: |
          xcode="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -v -i beta | sort -V | tail -n 1)"
          if [ -n "$xcode" ]; then sudo xcode-select -s "$xcode/Contents/Developer"; fi
          xcodebuild -version
          xcodebuild -version | grep -q '^Xcode 26' || { echo "no Xcode 26 on this runner"; exit 1; }
          swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  linux:
    name: Linux (Swift 6.4)
    runs-on: ubuntu-24.04
    container: swift:6.4.2-noble
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
